<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a1f2c" />
    </linearGradient>
    <linearGradient id="deckBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a9fff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="safeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dangerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cloudPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bg)" rx="16" />

  <!-- Title -->
  <text x="480" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">CloudDeck: Zero-Ban Architecture vs Native Proton Risk</text>
  <text x="480" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">How Cloud Streaming Bypasses Destiny 2 BattlEye Linux Bans Safely</text>

  <!-- Left: Steam Deck Handheld -->
  <rect x="40" y="110" width="260" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="55" y="125" width="230" height="40" rx="6" fill="url(#deckBlue)" />
  <text x="170" y="150" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Steam Deck (SteamOS)</text>
  
  <rect x="55" y="180" width="230" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="170" y="205" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CloudDeck Launcher</text>
  <text x="170" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">VA-API HW Decode (radeonsi)</text>

  <rect x="55" y="255" width="230" height="75" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="170" y="280" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Steam Input &amp; Game Mode</text>
  <text x="170" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Right Trackpad Mouse Navigation</text>
  <text x="170" y="318" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Standard XInput Controller</text>

  <rect x="55" y="345" width="230" height="65" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="170" y="370" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Decky Loader QAM Plugin</text>
  <text x="170" y="392" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Ping Monitor &amp; Quick Play</text>

  <!-- Middle: Paths (Red vs Green) -->
  <!-- Red Path (Native Proton) -->
  <path d="M 300 210 L 400 210 L 400 150 L 640 150" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="360" y="125" width="180" height="30" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="450" y="145" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Native Proton (BANNABLE)</text>

  <!-- Green Path (CloudDeck Streaming) -->
  <path d="M 300 290 L 440 290 L 440 330 L 640 330" fill="none" stroke="#10b981" stroke-width="4" />
  <polygon points="635,324 647,330 635,336" fill="#10b981" />
  <rect x="360" y="315" width="210" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="465" y="333" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Encrypted Video &amp; Input Stream</text>
  <text x="465" y="347" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">Zero DLL/Wine Hooks Injected</text>

  <!-- Right: Remote Cloud Infrastructure -->
  <rect x="650" y="110" width="270" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="665" y="125" width="240" height="40" rx="6" fill="url(#cloudPurple)" />
  <text x="785" y="150" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Cloud Gaming Host</text>

  <!-- GFN / Xbox / Boosteroid nodes -->
  <rect x="665" y="180" width="240" height="85" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="785" y="205" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Certified Windows Instance</text>
  <text x="785" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">GeForce NOW / Xbox / Boosteroid</text>
  <text x="785" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Genuine Windows Kernel &amp; Drivers</text>

  <!-- In-game Anti-Cheat execution -->
  <rect x="665" y="280" width="240" height="130" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="1" />
  <text x="785" y="305" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Destiny 2 Game Process</text>
  
  <rect x="680" y="320" width="210" height="35" rx="4" fill="url(#safeGreen)" />
  <text x="785" y="342" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BattlEye Anti-Cheat (PASSED)</text>

  <text x="785" y="380" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">✓ Valid Windows Environment</text>
  <text x="785" y="398" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">✓ Zero Ban Risk (100% Policy Compliant)</text>
</svg>
