<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="deckBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242832" />
      <stop offset="100%" stop-color="#14161d" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="900" height="480" fill="#0b0f19" rx="16" />

  <text x="450" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CloudDeck: Steam Deck (Neptune) Controller Layout</text>
  <text x="450" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Dual-Mode Controls: Right Trackpad Mouse for Menus + Native Gamepad for Combat</text>

  <!-- Steam Deck Handheld Chassis Outline -->
  <path d="M 120 120 C 120 100, 200 90, 450 90 C 700 90, 780 100, 780 120 C 820 150, 830 360, 780 400 C 750 420, 680 410, 450 410 C 220 410, 150 420, 120 400 C 70 360, 80 150, 120 120 Z" fill="url(#deckBody)" stroke="#334155" stroke-width="2" />

  <!-- Center Screen (16:10 Aspect Ratio) -->
  <rect x="270" y="130" width="360" height="230" rx="8" fill="url(#screenGrad)" stroke="#475569" stroke-width="2" />
  <text x="450" y="220" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CloudDeck Stream</text>
  <text x="450" y="245" fill="#10b981" font-family="sans-serif" font-size="12" text-anchor="middle">1280×800 60Hz / 90Hz OLED</text>
  <text x="450" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Destiny 2 Windows Cloud Host</text>

  <!-- Left Stick & D-Pad -->
  <circle cx="170" cy="180" r="28" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <circle cx="170" cy="180" r="18" fill="#334155" />
  <text x="170" y="185" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">L-Stick</text>

  <rect x="155" y="250" width="30" height="70" rx="4" fill="#1e293b" />
  <rect x="135" y="270" width="70" height="30" rx="4" fill="#1e293b" />
  <text x="170" y="290" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">D-PAD</text>

  <!-- Right Face Buttons & Stick -->
  <circle cx="730" cy="180" r="12" fill="#334155" /><text x="730" y="184" fill="#f8fafc" font-size="10" text-anchor="middle">Y</text>
  <circle cx="705" cy="205" r="12" fill="#334155" /><text x="705" y="209" fill="#f8fafc" font-size="10" text-anchor="middle">X</text>
  <circle cx="755" cy="205" r="12" fill="#334155" /><text x="755" y="209" fill="#f8fafc" font-size="10" text-anchor="middle">B</text>
  <circle cx="730" cy="230" r="12" fill="#334155" /><text x="730" y="234" fill="#f8fafc" font-size="10" text-anchor="middle">A</text>

  <circle cx="730" cy="285" r="28" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <circle cx="730" cy="285" r="18" fill="#334155" />
  <text x="730" y="290" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">R-Stick</text>

  <!-- Trackpads -->
  <!-- Left Trackpad (Scroll / D-Pad) -->
  <rect x="195" y="325" width="55" height="55" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="222" y="350" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Left Pad</text>
  <text x="222" y="365" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Scroll / D-Pad</text>

  <!-- Right Trackpad (Mouse Navigation - Highlighted) -->
  <rect x="650" y="325" width="55" height="55" rx="8" fill="#0f2b3e" stroke="#38bdf8" stroke-width="2" filter="url(#padGlow)" />
  <text x="677" y="350" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Right Pad</text>
  <text x="677" y="365" fill="#7dd3fc" font-family="sans-serif" font-size="8" text-anchor="middle">Mouse Cursor</text>

  <!-- Callouts -->
  <!-- Trackpad callout -->
  <path d="M 680 385 L 680 435 L 530 435" fill="none" stroke="#38bdf8" stroke-width="2" />
  <rect x="360" y="420" width="165" height="30" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="442" y="440" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Right Pad: Smooth Mouse</text>

  <!-- Grip Callout -->
  <path d="M 120 320 L 60 320 L 60 250" fill="none" stroke="#a855f7" stroke-width="2" />
  <rect x="15" y="215" width="105" height="50" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
  <text x="67" y="235" fill="#f3e8ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Grip Buttons</text>
  <text x="67" y="252" fill="#d8b4fe" font-family="sans-serif" font-size="9" text-anchor="middle">L4: F11 (Fullscreen)</text>
  <text x="67" y="263" fill="#d8b4fe" font-family="sans-serif" font-size="9" text-anchor="middle">R5: ESC (Menu)</text>
</svg>
