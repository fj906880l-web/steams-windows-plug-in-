  <text x="105" y="389" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">GeForce NOW</text>

  <rect x="206" y="365" width="178" height="38" rx="6" fill="#1a2533" stroke="#2a384a" stroke-width="1" />
  <text x="295" y="389" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Xbox Cloud</text>

  <rect x="16" y="411" width="178" height="38" rx="6" fill="#1a2533" stroke="#2a384a" stroke-width="1" />
  <text x="105" y="435" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Boosteroid</text>

  <rect x="206" y="411" width="178" height="38" rx="6" fill="#1a2533" stroke="#2a384a" stroke-width="1" />
  <text x="295" y="435" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Shadow PC</text>

  <!-- Section: Stream Latency Monitor -->
