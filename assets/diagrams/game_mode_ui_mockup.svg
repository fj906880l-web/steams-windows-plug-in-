  <!-- QAM Sidebar Background -->
  <rect width="400" height="680" fill="url(#qamBg)" rx="12" stroke="#3d4450" stroke-width="2" />

  <!-- Header -->
  <rect x="0" y="0" width="400" height="55" fill="#141c24" rx="12" />
  <text x="20" y="35" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">CloudDeck</text>
  <circle cx="365" cy="28" r="10" fill="#38bdf8" opacity="0.2" />
  <circle cx="365" cy="28" r="5" fill="#38bdf8" />

  <!-- Anti-Cheat Protection Card -->
  <rect x="16" y="70" width="368" height="74" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5" />
  <circle cx="42" cy="107" r="16" fill="#064e3b" />
  <text x="42" y="112" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
  <text x="68" y="98" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">Destiny 2 Ban-Immunity Active</text>
