  <text x="32" y="538" fill="#cbd5e1" font-family="sans-serif" font-size="11">Xbox Cloud Azure</text>
  <text x="350" y="538" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">19 ms</text>

  <text x="32" y="563" fill="#cbd5e1" font-family="sans-serif" font-size="11">Boosteroid Gateway</text>
  <text x="350" y="563" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">22 ms</text>

  <!-- Section: Steam Integration -->
  <rect x="16" y="600" width="368" height="44" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
  <text x="200" y="627" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Refresh Steam Game Mode Shortcuts</text>
